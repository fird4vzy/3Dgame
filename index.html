<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f7f0df" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lumenpost</title>
    <style>
      :root {
        --dusk: #141724;
        --ink: #eae6dc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--dusk);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
        /* A canvas is a replaced element: with `width: auto` it uses its
           intrinsic drawing-buffer size even when all insets are 0, so it must
           be stretched explicitly. Without this, dynamic resolution scaling (or
           any DPR != 1) leaves the buffer drawn at its own size in the corner. */
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      /* Boot screen is inline so it paints before any JS or WebGL work. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background:
          radial-gradient(circle at 1.5px 1.5px, rgba(34, 28, 43, 0.1) 1px, transparent 1.3px) 0 0 / 6px 6px,
          #f7f0df;
        color: #221c2b;
        transition: opacity 0.5s ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      .lantern {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border: 4px solid #c8402f;
        border-radius: 16%;
        color: #c8402f;
        font: 700 30px/1 "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
        transform: rotate(-5deg);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: rotate(-5deg) scale(0.94);
          opacity: 0.75;
        }
        50% {
          transform: rotate(-5deg) scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lantern {
          animation: none;
        }
      }
      #boot h1 {
        margin: 0;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 0.02em;
      }
      #boot p {
        margin: 0;
        color: #5a5168;
        font-size: 14px;
      }
      #boot .bar {
        width: 200px;
        height: 10px;
        background: #ddd0b4;
        border: 2.5px solid #221c2b;
        overflow: hidden;
      }
      #boot .bar span {
        display: block;
        height: 100%;
        width: 0%;
        background: #c8402f;
        transition: width 0.25s ease;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <div class="lantern" aria-hidden="true">灯</div>
      <h1>Lumenpost</h1>
      <div class="bar"><span id="boot-bar"></span></div>
      <p id="boot-msg">Waking the planet&hellip;</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
