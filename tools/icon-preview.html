<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Icon masks</title>
    <style>
      /* Review sheet for generated icon masks. Serve with `npm run dev` and
         open /tools/icon-preview.html. The panel behind each icon is a hard
         edge on purpose: an opaque frame left over from the sheet's gutters is
         invisible against a matching background and obvious against this one. */
      body { margin:0; background:#141724; display:flex; gap:26px; padding:40px;
             font:12px system-ui; color:#a5aac0; flex-wrap:wrap; }
      figure { margin:0; text-align:center; background:#2b3048; padding:8px; border-radius:8px; }
      .icon { width:72px; height:72px; background-color:#e8a33a;
              -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
              -webkit-mask-position:center; mask-position:center;
              -webkit-mask-size:contain; mask-size:contain; }
    </style>
  </head>
  <body>
    <script>
      for (const name of ['parcel', 'shard', 'compass', 'letter', 'lantern', 'star']) {
        const fig = document.createElement('figure');
        const div = document.createElement('div');
        div.className = 'icon';
        const url = `url(/assets/ui/icons/${name}.png)`;
        div.style.webkitMaskImage = url;
        div.style.maskImage = url;
        const cap = document.createElement('figcaption');
        cap.textContent = name;
        fig.append(div, cap);
        document.body.appendChild(fig);
      }
    </script>
  </body>
</html>
